name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyrun
          POSTGRES_PASSWORD: keyrun
          POSTGRES_DB: keyrun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keyrun" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEYRUN_DATABASE_URL: postgres://keyrun:keyrun@127.0.0.1:5432/keyrun
      KEYRUN_MOCKS_DATABASE_URL: postgres://keyrun:keyrun@127.0.0.1:5432/keyrun_mocks
      KEYRUN_TEST_DATABASE_URL: postgres://keyrun:keyrun@127.0.0.1:5432/keyrun_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:setup
      - run: npm run typecheck
      - run: npm test
      # 50 runs of every workflow against freshly randomized mess, graded by the apps' own databases.
      - run: npm run eval -- --runs 50 --readme no
      # Fails the build if any success rate dropped below evals/baseline.json.
      - run: npm run eval:gate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            artifacts/eval/
          if-no-files-found: ignore
